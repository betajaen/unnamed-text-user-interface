<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTUI Demo</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: chocolate;
    }

    #container {
      position: absolute;
      /* left, top, width, height set by JS */
    }

    #container canvas {
      position: absolute;
      left: 0;
      top: 0;
      display: block;
    }

    #cursor {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
      /* width/height set to cellWidth/cellHeight by JS */
      /* moved via transform: translate(x, y) */
    }
    div#xstatus {
      height: 0.25em;
      width: 1em;
      display: block;
      z-index: 999;
      position: fixed;
      left: 0;
      top: 0;
      color: black;
    }
  </style>
</head>
<body>
  <div id="xstatus"></div>
  <div id="container"></div>


  <script src="/demo.js"></script>
  <script>
    let ws = null;
    let connected = false;
    function connect() {
      if (ws !== null && ws.readyState !== 0)
        return;
      setTimeout(connect, 250);
      console.log("Attempting to connect....", "ws://" + location.host + "/__dev");
      ws = new WebSocket("ws://" + location.host + "/__dev");
      ws.onopen = (e) => {
        ws.send("Hello from " + navigator.userAgent);
        console.log("connected", JSON.parse(JSON.stringify(e)));
         document.getElementById("xstatus").style.backgroundColor = 'pink';
      }
      ws.onmessage = (e) => {
        document.getElementById("xstatus").style.backgroundColor = 'yellow';
        if (e.data === "reload") {
          location.reload();
        }
      };
      ws.onerror = (e) => {
        console.log(e);
        document.getElementById("xstatus").style.backgroundColor = 'red';
        ws = null;
      }
      ws.onclose = (e) => {
        console.log('Close code:', e.code, 'Reason:', e.reason);
        document.getElementById("xstatus").style.backgroundColor = 'blue';
        ws = null;
      }
    }
    window.addEventListener('load', () => {
      setTimeout(connect, 500);
        setTimeout(() => {
        console.log("500");
      }, 500);
    });
  </script>
</body>
</html>
